name: Temporary PR214 final rebase proof

on:
  push:
    branches:
      - wip/214-review3-hostile-path-matrix
    paths:
      - .github/workflows/tmp-214-final-rebase-proof.yml

permissions:
  contents: write

jobs:
  prove-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out contributor branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/bounded-trace-loader
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase same contributor branch onto current upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/richinmrudul/agentguard.git || true
          git fetch upstream main
          test "$(git rev-parse upstream/main)" = "0449e7d059e4990458462ada83c0237dc8e57c72"
          git rebase upstream/main

      - name: Apply final review cleanup and interpreter-independent nesting guard
        run: |
          python - <<'PY'
          from pathlib import Path

          execution = Path("agentguard/traces/execution.py")
          text = execution.read_text(encoding="utf-8")
          if "def _validate_json_nesting(" not in text:
              marker = "\ndef load_execution_trace(path: Path) -> ExecutionTrace:\n"
              helper = r'''

def _validate_json_nesting(line: str) -> None:
    """Reject excessive JSON nesting before parser recursion varies by Python."""
    depth = 0
    in_string = False
    escaped = False
    for char in line:
        if in_string:
            if escaped:
                escaped = False
            elif char == "\\":
                escaped = True
            elif char == '"':
                in_string = False
            continue
        if char == '"':
            in_string = True
        elif char in "[{":
            depth += 1
            # _validate_bounds() treats the parsed root as depth zero, so the
            # lexical form may contain the root plus MAX_TRACE_NESTING nested
            # containers without narrowing the existing accepted boundary.
            if depth > MAX_TRACE_NESTING + 1:
                raise ValueError(
                    f"Trace JSON exceeds the {MAX_TRACE_NESTING}-level nesting limit."
                )
        elif char in "]}" and depth:
            depth -= 1
'''
              if marker not in text:
                  raise SystemExit("load_execution_trace marker not found")
              text = text.replace(marker, helper + marker, 1)

          old = '''                try:\n                    record = json.loads(line)\n                except (json.JSONDecodeError, RecursionError) as error:\n                    raise ValueError(\n                        f"Invalid trace JSON on line {line_number}: {error}"\n                    ) from error\n'''
          new = '''                try:\n                    _validate_json_nesting(line)\n                    record = json.loads(line)\n                except (json.JSONDecodeError, RecursionError, ValueError) as error:\n                    raise ValueError(\n                        f"Invalid trace JSON on line {line_number}: {error}"\n                    ) from error\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "_validate_json_nesting(line)" not in text:
              raise SystemExit("json.loads block not found")
          execution.write_text(text, encoding="utf-8")

          old_tests = Path("tests/unit/test_execution_trace.py")
          old_text = old_tests.read_text(encoding="utf-8")
          old_text = old_text.replace(
              '_HOSTILE_KINDS = ("invalid_utf8", "malformed_json", "deep_json", "wrong_shape")',
              '_HOSTILE_KINDS = ("malformed_json", "deep_json")',
              1,
          )
          start = old_text.find('    if kind == "invalid_utf8":\n', old_text.find("def _hostile_trace_file("))
          malformed = old_text.find('    elif kind == "malformed_json":\n', start)
          if start != -1 and malformed != -1:
              old_text = old_text[:start] + '    if kind == "malformed_json":\n' + old_text[malformed + len('    elif kind == "malformed_json":\n'):]
          wrong = old_text.find('    elif kind == "wrong_shape":\n', old_text.find("def _hostile_trace_file("))
          otherwise = old_text.find('    else:  # pragma: no cover - guards the parametrisation itself\n', wrong)
          if wrong != -1 and otherwise != -1:
              old_text = old_text[:wrong] + old_text[otherwise:]
          old_tests.write_text(old_text, encoding="utf-8")

          route_tests = Path("tests/unit/test_execution_trace_rejection_paths.py")
          route_text = route_tests.read_text(encoding="utf-8")
          if "test_json_nesting_preflight_ignores_delimiters_inside_strings" not in route_text:
              route_text += r'''


def test_json_nesting_preflight_ignores_delimiters_inside_strings() -> None:
    trace_module._validate_json_nesting(
        '{"marker":"' + "[" * 1000 + "}" * 1000 + '\\"still-string"}'
    )


def test_json_nesting_preflight_accepts_exact_existing_boundary() -> None:
    depth = trace_module.MAX_TRACE_NESTING + 1
    trace_module._validate_json_nesting("[" * depth + "]" * depth)


def test_json_nesting_preflight_rejects_one_above_existing_boundary() -> None:
    depth = trace_module.MAX_TRACE_NESTING + 2
    with pytest.raises(ValueError, match="nesting limit"):
        trace_module._validate_json_nesting("[" * depth + "]" * depth)
'''
          route_tests.write_text(route_text, encoding="utf-8")
          PY

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.9"
      - name: Install and prove Python 3.9
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/unit/test_execution_trace.py tests/unit/test_trace_replay.py tests/unit/test_execution_trace_rejection_paths.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install and prove Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/unit/test_execution_trace.py tests/unit/test_trace_replay.py tests/unit/test_execution_trace_rejection_paths.py
          python -m ruff check agentguard/traces/execution.py tests/unit/test_execution_trace.py tests/unit/test_execution_trace_rejection_paths.py

      - name: Commit corrected rebased head
        run: |
          set -euo pipefail
          git config user.name "Nickgonzales76017"
          git config user.email "45552585+Nickgonzales76017@users.noreply.github.com"
          git add agentguard/traces/execution.py tests/unit/test_execution_trace.py tests/unit/test_execution_trace_rejection_paths.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(trace): make hostile rejection routes deterministic"
          fi
          git diff upstream/main...HEAD --check
          old="82bca309477d3c4093db96e86433711477e04803"
          git push --force-with-lease=refs/heads/fix/bounded-trace-loader:${old} origin HEAD:fix/bounded-trace-loader
