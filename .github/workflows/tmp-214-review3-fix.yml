name: Temporary PR214 review-3 fixer

on:
  push:
    branches:
      - wip/214-review3-hostile-path-matrix

permissions:
  contents: write

jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out WIP branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: wip/214-review3-hostile-path-matrix
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply the bounded Windows drive-root fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("agentguard/traces/execution.py")
          text = path.read_text(encoding="utf-8")
          guard = '        or re.match(r"^[A-Za-z]:/", candidate) is not None\n'
          if guard in text:
              raise SystemExit(0)
          needle = "        or path.is_absolute()\n"
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one normalized-path absolute guard")
          text = text.replace(needle, needle + guard, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run hostile trace and replay regression suites
        run: |
          python -m pytest -q \
            tests/unit/test_execution_trace.py \
            tests/unit/test_trace_replay.py \
            tests/unit/test_execution_trace_rejection_paths.py

      - name: Run focused Ruff
        run: |
          python -m ruff check \
            agentguard/traces/execution.py \
            tests/unit/test_execution_trace.py \
            tests/unit/test_trace_replay.py \
            tests/unit/test_execution_trace_rejection_paths.py

      - name: Commit production fix after tests pass
        run: |
          set -euo pipefail
          git add agentguard/traces/execution.py
          if git diff --cached --quiet; then
            echo "Production fix already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reject Windows drive-root trace paths"
          git push origin HEAD:wip/214-review3-hostile-path-matrix
